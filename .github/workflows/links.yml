name: Link check

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One open "Broken links" issue at most: opened or updated when a link
      # fails, closed by the next clean run. The run itself still goes red.
      - name: Check every link, one request per second
        run: |
          set +e
          node scripts/check-links.mjs README.md --report="$RUNNER_TEMP/broken.md"
          code=$?
          set -e
          if [ -s "$RUNNER_TEMP/broken.md" ]; then
            node scripts/github-issue.mjs upsert --topic broken-links --title "Broken links" --body-file "$RUNNER_TEMP/broken.md"
          elif [ "$code" -eq 0 ]; then
            node scripts/github-issue.mjs close --topic broken-links --comment "Every link answered on the latest check."
          else
            printf 'The link check stopped with exit code %s before it could list broken links.\n\nRun: %s\n' "$code" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/crash.md"
            node scripts/github-issue.mjs upsert --topic broken-links --title "Link check failed to run" --body-file "$RUNNER_TEMP/crash.md"
          fi
          exit "$code"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # GitHub disables scheduled workflows after 60 days without repository activity.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: |
          curl -fsS -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/links.yml/enable"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
