name: Links

on:
  push:
    branches: [main]
    paths: [README.md, 'scripts/**', .github/workflows/ci.yml]
  pull_request:
    paths: [README.md, 'scripts/**', .github/workflows/ci.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests for the link check and issue scripts
        run: node --test 'scripts/*.test.mjs'
      - run: node scripts/check-links.mjs README.md
